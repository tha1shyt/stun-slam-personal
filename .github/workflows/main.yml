name: Build StunSlam Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Project Files
        run: |
          if [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle not found in repository root!"
            echo "Please upload: build.gradle, settings.gradle, gradle.properties, and the src folder."
            exit 1
          fi

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: StunSlam-1.21.x-Mod
          path: build/libs/*.jar
